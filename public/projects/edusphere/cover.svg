<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Top Telemetry Header -->
  <g transform="translate(60, 60)">
    <rect width="320" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="17" r="4" fill="#3b82f6"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="1.5">CLIENT WEB PLATFORM // CYBER ALIENS</text>
  </g>

  <!-- Central Card Content -->
  <g transform="translate(60, 160)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="2">GLOBAL EDUCATION // NEW ZEALAND ADMISSIONS</text>
    
    <text x="0" y="110" font-family="'Syne', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">EduSphereNZ</text>
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">
      Higher Education Consultancy &amp; Student Immigration Portal
    </text>

    <!-- Technical Specs Row -->
    <g transform="translate(0, 220)">
      <rect width="180" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">REGION</text>
      <text x="20" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">New Zealand</text>
      
      <rect x="200" width="220" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="220" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">DEPLOYMENT</text>
      <text x="220" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Web // Lead Engine</text>

      <rect x="440" width="220" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="460" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">SCOPE</text>
      <text x="460" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Visa &amp; Enrollment</text>
    </g>
  </g>

  <!-- Bottom URL Pill -->
  <g transform="translate(60, 640)">
    <rect width="280" height="42" rx="21" fill="rgba(0,0,0,0.6)" stroke="rgba(59,130,246,0.4)"/>
    <circle cx="24" cy="21" r="5" fill="#3b82f6"/>
    <text x="42" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">eduspherenz.com</text>
  </g>
</svg>