<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141117"/>
      <stop offset="100%" stop-color="#070608"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Top Telemetry Header -->
  <g transform="translate(60, 60)">
    <rect width="360" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="17" r="4" fill="#f43f5e"/>
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.5">STRATEGIC ALLIANCE // YOUTH EQUITY</text>
  </g>

  <!-- Central Card Content -->
  <g transform="translate(60, 160)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#fda4af" letter-spacing="2">NON-PROFIT // PHILANTHROPY PLATFORM</text>
    
    <text x="0" y="110" font-family="'Syne', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Mind Empowered Portal</text>
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">
      International Youth Wellness &amp; Mental Health Digital Flagship
    </text>

    <!-- Technical Specs Row -->
    <g transform="translate(0, 220)">
      <rect width="200" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">PARTNERSHIP</text>
      <text x="20" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Official Ally</text>
      
      <rect x="220" width="220" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="240" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">IMPACT REACH</text>
      <text x="240" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">18,000+ Students</text>

      <rect x="460" width="220" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="480" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">INITIATIVE</text>
      <text x="480" y="48" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Youth Empowerment</text>
    </g>
  </g>

  <!-- Right Logo Badge -->
  <g transform="translate(860, 200)">
    <rect width="240" height="240" rx="36" fill="#ffffff" stroke="rgba(255,255,255,0.2)" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.5))"/>
    <image href="/brand/mind-empowered.png" x="20" y="20" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="744" width="1200" height="6" fill="#f43f5e"/>
</svg>
